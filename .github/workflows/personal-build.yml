name: Personal APK build

# Builds "DreamPlayer Personal" (com.dreamplayer.personal) on every push and
# uploads the APKs as workflow artifacts:
#   - armeabi-v7a  -> Fire TV Cube / Fire TV Stick (32-bit Fire OS)
#   - arm64-v8a    -> 64-bit Android TV boxes (e.g. Homatics / Dune)
# Signed with android/app/personal.jks (committed on purpose, personal
# sideload build) so every new APK installs as an update over the old one.
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Signing config
        run: |
          cat > android/key.properties <<EOF
          storePassword=dreamplayer-personal
          keyPassword=dreamplayer-personal
          keyAlias=personal
          storeFile=personal.jks
          EOF

      - name: Build split-per-abi APKs
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build.log || {
            # Surface compile errors as annotations (readable via the API).
            msg=$(grep -E "Error:|error:|^e: |What went wrong" -A2 build.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=build::${msg}"
            exit 1
          }

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-armeabi-v7a-release.apk DreamPlayerPersonal-FireTV-armeabi-v7a.apk
          mv app-arm64-v8a-release.apk DreamPlayerPersonal-arm64-v8a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DreamPlayerPersonal-FireTV-armeabi-v7a
          path: build/app/outputs/flutter-apk/DreamPlayerPersonal-FireTV-armeabi-v7a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DreamPlayerPersonal-arm64-v8a
          path: build/app/outputs/flutter-apk/DreamPlayerPersonal-arm64-v8a.apk
